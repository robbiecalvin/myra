          };
          els.homeStatus.textContent = " ";
          els.stepStatus.textContent = " ";
          els.micStatus.textContent = " ";
        }

        function applyTalkText(text) {
          const raw = safeText(text);
          const n = normalize(raw);

          if (
            n.includes("beer") ||
            n.includes("ipa") ||
            n.includes("lager") ||
            n.includes("pilsner") ||
            n.includes("stout") ||
            n.includes("porter") ||
            n.includes("ale") ||
            n.includes("sour")
          ) {
            state.mode = "beer";
          } else if (
            n.includes("spirit") ||
            n.includes("liquor") ||
            n.includes("cocktail") ||
            n.includes("vodka") ||
            n.includes("whiskey") ||
            n.includes("whisky") ||
            n.includes("gin") ||
            n.includes("rum") ||
            n.includes("tequila")
          ) {
            state.mode = "bar";
          } else {
            state.mode = "wine";
          }

          if (state.mode === "wine") {
            const foodsByType = {};
            ["meats", "cheese", "pasta", "specialty"].forEach(t => (foodsByType[t] = wineUniquePipe(t)));
            const parsed = window.MyraNlu.parseWine(raw, {
              grapes: wineUnique("grape_primary"),
              buyerEvents: wineUnique("buyer_event"),
              countries: wineUnique("country"),
              flavors: uniq(wineUnique("flavor_primary").concat(wineUnique("flavor_secondary")).concat(wineUnique("flavor_tertiary"))),
              foodsByType,
              wordmap: data.wordmap,
            });
            applyStatePatch("wine", parsed.statePatch || {});
            if (Array.isArray(parsed.statePatch?.flavors)) state.wine.flavors = parsed.statePatch.flavors.slice(0, 3);
          } else if (state.mode === "beer") {
            const parsed = window.MyraNlu.parseBeer(raw, {
              categories: beerUnique("category"),
              styles: beerUnique("style"),
              breweries: beerUnique("brewery"),
              hops: beerUnique("hops"),
              yeasts: beerUnique("yeast"),
              tags: beerUnique("classification_tags"),
              foods: beerUnique("foods_best_with"),
              wordmap: data.wordmap,
            });
            applyStatePatch("beer", parsed.statePatch || {});
          } else {
            const parsed = window.MyraNlu.parseBar(raw, {
              spirits: barUnique("spirit"),
              names: barUnique("name"),
              wordmap: data.wordmap,
            });
            applyStatePatch("bar", parsed.statePatch || {});
          }
        }

        async function ask(prompt) {
          await window.MyraVoice.speakAsync(prompt);
          const heard = await window.MyraVoice.listenOnce({ timeoutMs: 9000, startDelayMs: 0 });
          return safeText(heard);
        }

        async function guidedFlow() {
          state.guided = true;
          state.interaction = "guided";
          show(els.step);
          renderModeChooser();

          const a = await ask("Are you looking for wine, beer, or spirits?");
          const n = normalize(a);
          if (n.includes("beer")) state.mode = "beer";
          else if (n.includes("spirit") || n.includes("liquor") || n.includes("vodka") || n.includes("whiskey") || n.includes("gin") || n.includes("rum") || n.includes("tequila")) state.mode = "bar";
          else state.mode = "wine";

          state.stepIndex = 0;
          renderStep();

          // Walk steps automatically.
          while (state.guided) {
            const steps = stepsForMode(state.mode);
            const step = steps[state.stepIndex];
            if (!step) break;

            els.stepStatus.textContent = "Listening…";
            const answer = await ask(step.prompt);
            els.stepStatus.textContent = " ";
            state.stepAnswers[state.mode][step.key] = answer;
            try {
              step.parseAnswer(answer);
            } catch (err) {
              console.error(err);
            }
            // Render and commit from the current state (so UI stays in sync).
            renderStep();
            try {
              step.commit();
            } catch {
              // ignore
            }
            state.stepIndex++;
            if (state.stepIndex >= steps.length) break;
            renderStep();
          }
          await showResults();
          state.guided = false;
        }

        async function talkFlow() {
          show(els.home);
          state.interaction = "talk";
          els.homeStatus.textContent = "Listening…";
          const heard = await window.MyraVoice.listenOnce({ timeoutMs: 9000, startDelayMs: 0 });
          els.homeStatus.textContent = " ";
          const text = safeText(heard);
          state.lastUtterance = text;
          applyTalkText(text);
          await showResults();
        }

        async function refineFlow() {
          show(els.results);
          if (!window.MyraVoice || typeof window.MyraVoice.listenOnce !== "function") {
            els.micStatus.textContent = "Voice recognition not available in this browser.";
            return;
          }
          els.micStatus.textContent = "Listening…";
          const heard = await window.MyraVoice.listenOnce({ timeoutMs: 9000, startDelayMs: 0 });
          els.micStatus.textContent = " ";
          const text = safeText(heard);
          if (!text) return;

          const n = normalize(text);
          // Global quick commands
          if (/\b(start over|restart|reset)\b/.test(n)) {
            resetAll();
            show(els.home);
            return;
          }

          // "Another one" => exclude last pick by name and rerun.
          if (/\b(another|different|something else|next)\b/.test(n) && state.lastPick?.name) {
            const name = safeText(state.lastPick.name);
            if (state.mode === "wine") state.wine.excludes.names = mergeUnique(state.wine.excludes.names, [name]);
            if (state.mode === "beer") state.beer.excludes.names = mergeUnique(state.beer.excludes.names, [name]);
            if (state.mode === "bar") state.bar.excludes.names = mergeUnique(state.bar.excludes.names, [name]);
            await showResults();
            return;
          }

          // Price direction shortcuts
          if (state.mode === "wine") {
            if (/\b(cheaper|less expensive|lower price|lower budget|more budget)\b/.test(n)) {
              state.wine.price = "budget";
              state.wine.priceMin = null;
              state.wine.priceMax = state.wine.priceMax != null ? Math.max(10, Number(state.wine.priceMax) - 5) : null;
            }
            if (/\b(more expensive|nicer|step up|upgrade|premium|top shelf)\b/.test(n)) {
              state.wine.price = "premium";
              state.wine.priceMin = null;
              state.wine.priceMax = null;
            }
          }

          // Apply domain patches from NLU.
          if (state.mode === "wine") {
            const foodsByType = {};
            ["meats", "cheese", "pasta", "specialty"].forEach(t => (foodsByType[t] = wineUniquePipe(t)));
            const parsed = window.MyraNlu.parseWine(text, {
              grapes: wineUnique("grape_primary"),
              buyerEvents: wineUnique("buyer_event"),
              countries: wineUnique("country"),
              flavors: uniq(wineUnique("flavor_primary").concat(wineUnique("flavor_secondary")).concat(wineUnique("flavor_tertiary"))),
              foodsByType,
              wordmap: data.wordmap,
            });
            applyStatePatch("wine", parsed.statePatch || {});
            if (Array.isArray(parsed.statePatch?.flavors)) state.wine.flavors = parsed.statePatch.flavors.slice(0, 3);
          } else if (state.mode === "beer") {
            const parsed = window.MyraNlu.parseBeer(text, {
              categories: beerUnique("category"),
              styles: beerUnique("style"),
              breweries: beerUnique("brewery"),
              hops: beerUnique("hops"),
              yeasts: beerUnique("yeast"),
              tags: beerUnique("classification_tags"),
              foods: beerUnique("foods_best_with"),
              wordmap: data.wordmap,
            });
            applyStatePatch("beer", parsed.statePatch || {});
          } else {
            const parsed = window.MyraNlu.parseBar(text, {
              spirits: barUnique("spirit"),
              names: barUnique("name"),
              wordmap: data.wordmap,
            });
            applyStatePatch("bar", parsed.statePatch || {});
          }

          await showResults();
        }

        function currentSteps() {
          return state.mode ? stepsForMode(state.mode) : [];
        }

        function loadPrefs() {
          try {
            const raw = localStorage.getItem("myra:prefs:v1");
            if (!raw) return;
            const snap = JSON.parse(raw);
            if (!snap || snap.version !== 1) return;

            // Start from defaults (resetAll already ran), then merge.
            if (snap.mode === "wine" || snap.mode === "beer" || snap.mode === "bar") state.mode = snap.mode;
            if (snap.wine && typeof snap.wine === "object") Object.assign(state.wine, snap.wine);
            if (snap.beer && typeof snap.beer === "object") Object.assign(state.beer, snap.beer);
            if (snap.bar && typeof snap.bar === "object") Object.assign(state.bar, snap.bar);
            if (snap.stepAnswers && typeof snap.stepAnswers === "object") state.stepAnswers = snap.stepAnswers;
            if (snap.lastUtterance && typeof snap.lastUtterance === "string") state.lastUtterance = snap.lastUtterance;
            els.homeStatus.textContent = "Loaded last preferences.";
          } catch {
            // ignore
          }
        }

        els.btnGuided.addEventListener("click", async () => {
          try {
            await loadAll();
          } catch (err) {
            console.error(err);
            els.homeStatus.textContent = "Failed to load data. Check your server and try again.";
            return;
          }
          resetAll();
          await guidedFlow();
        });

        els.btnTalk.addEventListener("click", async () => {
          try {
            await loadAll();
          } catch (err) {
            console.error(err);
            els.homeStatus.textContent = "Failed to load data. Check your server and try again.";
            return;
          }
          resetAll();
          await talkFlow();
        });

        els.btnBack.addEventListener("click", () => {
          if (!state.mode) return;
          state.stepIndex = Math.max(0, state.stepIndex - 1);
          renderStep();
        });

        els.btnNext.addEventListener("click", async () => {
          if (!state.mode) return;
          state.interaction = "manual";
          const steps = currentSteps();
          const step = steps[state.stepIndex];
          if (step) step.commit();
          state.stepIndex++;
          if (state.stepIndex >= steps.length) {
            await showResults();
            return;
          }
          renderStep();
        });

        els.btnCancel.addEventListener("click", () => {
          resetAll();
          show(els.home);
        });

        els.btnResultsStartOver.addEventListener("click", () => {
          resetAll();
          show(els.home);
        });

        els.btnResultsTalk.addEventListener("click", async () => {
          try {
            await loadAll();
          } catch (err) {
            console.error(err);
            els.homeStatus.textContent = "Failed to load data. Check your server and try again.";
            return;
          }
          resetAll();
          await talkFlow();
        });

        els.btnResultsRefine.addEventListener("click", async () => {
          try {
            await loadAll();
          } catch (err) {
            console.error(err);
            els.homeStatus.textContent = "Failed to load data. Check your server and try again.";
            return;
          }
          state.interaction = "talk";
          await refineFlow();
        });

        // Enable mic button if browser supports recognition; it's informational in this UI.
        els.micBtn.disabled = !(window.SpeechRecognition || window.webkitSpeechRecognition);
        els.micBtn.textContent = "Browser Mic";
        els.micStatus.textContent = els.micBtn.disabled
          ? "Voice recognition not available in this browser."
          : " ";

        // Initialize defaults + restore last preferences.
        resetAll();
        loadPrefs();
      })();
    </script>
  </body>
</html>
